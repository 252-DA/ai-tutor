name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-tutor
      - uses: 252-DA/ai-sdk/.github/actions/materialize@d9b39ce3c90d9031e6ec459e6610000795b3d57f
        with:
          path: ai-sdk
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: ai-tutor
        run: uv sync --frozen --python 3.10
      - name: Run tests
        working-directory: ai-tutor
        run: uv run --frozen pytest -q
