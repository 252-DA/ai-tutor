[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tutor-service"
version = "0.1.0"
description = "Course-grounded AI tutor service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ai-runtime-sdk[gemini,openai]",
    "fastapi>=0.115",
    "pydantic-settings>=2.10",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
ai-runtime-sdk = { path = "../ai-sdk", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
